name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package without publishing (dry run)"
        type: boolean
        default: false

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            extension/webview-ui/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install
        working-directory: extension

      - name: Install webview dependencies
        run: pnpm install
        working-directory: extension/webview-ui

      - name: Build extension
        run: pnpm build
        working-directory: extension

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Package extension
        id: package
        run: |
          cd extension
          vsce package --out orbiagents.vsix
          echo "vsix_path=$(realpath orbiagents.vsix)" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: inputs.dry_run != true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --packagePath "${{ steps.package.outputs.vsix_path }}"

      - name: Publish to Open VSX
        if: inputs.dry_run != true
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: ovsx publish "${{ steps.package.outputs.vsix_path }}" -p "$OPEN_VSX_TOKEN"

      - name: Upload VSIX to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.vsix_path }}
