appId: com.sudarshantechlabs.orbiagents
protocols:
  - name: OrbiAgents Hire Profile
    schemes:
      - orbiagents
productName: OrbiAgents
copyright: Copyright © 2026 SudarshanTechLabs
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/.env*"
  - "!**/*.{pem,p12,p8,key,jks,keystore}"
  - "!node_modules/node-pty/prebuilds/darwin-x64/**"
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
npmRebuild: true
forceCodeSigning: true
publish:
  provider: github
  owner: SUDARSHANCHAUDHARI
  repo: OrbiAgents
  releaseType: release
afterPack: scripts/after-pack.cjs
mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: OrbiAgents records audio only after explicit consent for private, local transcription.
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  sign: false
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
linux:
  category: Development
  syncDesktopName: true
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
